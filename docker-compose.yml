services:
  api:
    build: .
    container_name: guardrails-gateway-api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: guardrails-gateway
      LLM_MODE: mock
      DATABASE_URL: sqlite+aiosqlite:///./data/app.db
      LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
    restart: unless-stopped
