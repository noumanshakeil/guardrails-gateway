[project]
name = "guardrails-gateway"
version = "2.0.0"
description = "Policy gateway for PII, toxicity, and custom regex rules — pre-flight checks block or allow prompts before they reach the LLM, with operator CRUD and a decision audit log."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
